name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: |
          xcodebuild -project NOVA.xcodeproj -scheme NOVA -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/NOVA.app Payload/
          zip -qr NOVA.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-ipa
          path: NOVA.ipa
